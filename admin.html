<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>약사 전용 만성질환 정밀 문진 접수 대장</title>
  <!-- 1차 정적 Tailwind CSS (디자인 깨짐 방지 안전망) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <!-- 2차 동적 Tailwind CDN & Supabase SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      background-color: #f1f5f9;
      color: #1e293b;
    }
    .hidden { display: none !important; }
    #emptyGuide svg { width: 4rem; height: 4rem; margin-bottom: 0.75rem; opacity: 0.3; }

    @media (max-width: 767px) {
      #queueAside { display: flex; flex-direction: column; width: 100%; }
      #detailMain { display: none; width: 100%; }
      body.show-detail #queueAside { display: none !important; }
      body.show-detail #detailMain { display: flex !important; flex-direction: column; }
      .desktop-only { display: none !important; }
    }
    @media (min-width: 768px) {
      #queueAside { display: flex !important; flex-direction: column; width: 22rem; flex-shrink: 0; }
      #detailMain { display: flex !important; flex-direction: column; flex: 1; }
      .mobile-only { display: none !important; }
    }
    .custom-scroll { -webkit-overflow-scrolling: touch; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; overflow: visible !important; height: auto !important; }
      #detailMain { display: block !important; padding: 0 !important; overflow: visible !important; }
      #detailCard { border: none !important; box-shadow: none !important; padding: 0 !important; max-width: 100% !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-slate-900 text-white min-h-[52px] py-2 px-3 sm:px-5 flex items-center justify-between shadow-sm flex-shrink-0 no-print gap-2">
    <div class="flex items-center space-x-2 overflow-hidden">
      <span class="w-7 h-7 rounded-lg bg-emerald-500 text-slate-900 font-extrabold flex items-center justify-center text-sm flex-shrink-0">+</span>
      <h1 class="font-bold text-sm sm:text-base tracking-tight truncate">만성질환 문진 접수 대장</h1>
      <span class="hidden sm:inline-flex text-xs px-2 py-0.5 rounded-full bg-emerald-900 text-emerald-300 border border-emerald-700 items-center gap-1 flex-shrink-0">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        작성 내용 자동 보존
      </span>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      <span id="queueCounter" class="text-xs text-slate-300 font-mono">연결 중...</span>
      <button type="button" onclick="resetGeminiApiKey()" class="px-2 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition border border-slate-700 font-medium" title="API 키 변경/재설정">
        🔑 API 키 설정
      </button>
      <button type="button" id="btnRefresh" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition border border-slate-700 font-medium">
        새로고침
      </button>
    </div>
  </header>

  <!-- 메인 프레임워크 -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- 좌측 대기열 목록 -->
    <aside id="queueAside" class="bg-white border-r border-slate-200 flex flex-col flex-shrink-0 no-print h-full">
      <div class="p-3 border-b border-slate-200 bg-slate-50 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-700">접수 환자 목록</span>
          <select id="statusFilter" class="text-xs border border-slate-300 rounded px-2 py-1 bg-white focus:outline-none">
            <option value="ALL">전체 보기</option>
            <option value="대기중" selected>대기중만 보기</option>
            <option value="완료">상담 완료</option>
          </select>
        </div>

        <!-- 환자 이름 / 생년월일 6자리 실시간 검색창 -->
        <div class="relative flex items-center">
          <span class="absolute left-2.5 text-slate-400 text-xs pointer-events-none">🔍</span>
          <input 
            type="text" 
            id="patientSearchInput" 
            autocomplete="off" 
            oninput="handlePatientSearch()" 
            placeholder="이름 또는 생년월일 6자리(예: 700604)" 
            class="w-full text-xs pl-7 pr-7 py-1.5 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium"
          >
          <button 
            type="button" 
            id="btnClearSearch" 
            onclick="clearPatientSearch()" 
            class="hidden absolute right-2 text-slate-400 hover:text-slate-600 text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full"
            title="검색어 지우기"
          >✕</button>
        </div>
      </div>

      <div id="patientQueue" class="flex-1 overflow-y-auto divide-y divide-slate-100 custom-scroll pb-24">
        <div class="p-8 text-center text-xs text-slate-400">⏳ 환자 목록을 불러오는 중입니다...</div>
      </div>
    </aside>

    <!-- 우측 환자 문진 상세 인스펙터 -->
    <main id="detailMain" class="bg-slate-100 p-3.5 sm:p-6 pb-32 sm:pb-20 overflow-y-auto flex-col h-full custom-scroll">
      
      <div id="emptyGuide" class="h-full flex flex-col items-center justify-center text-slate-400 text-center p-6">
        <svg class="w-16 h-16 stroke-current mb-3 opacity-30" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <p class="text-sm font-medium">좌측 목록에서 환자를 선택하면 정밀 문진 내역이 표시됩니다.</p>
      </div>

      <div id="detailCard" class="hidden bg-white rounded-xl sm:rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-7 space-y-5 max-w-4xl mx-auto w-full mb-10"></div>

    </main>

  </div>

  <!-- 이미지 고화질 라이트박스 모달 -->
  <div id="imageLightboxModal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-3 no-print">
    <div class="bg-white rounded-2xl max-w-3xl w-full p-4 shadow-2xl space-y-3 border border-slate-200" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h4 id="lightboxTitle" class="font-bold text-slate-900 text-sm truncate">사진 상세 미리보기</h4>
        <button type="button" id="btnCloseLightbox" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-base transition">✕</button>
      </div>
      <div class="bg-slate-100 rounded-xl p-2 flex items-center justify-center min-h-[300px] max-h-[75vh] overflow-hidden">
        <img id="lightboxImg" src="" alt="사진 원본" class="max-h-[70vh] w-auto max-w-full rounded-lg object-contain">
      </div>
      <div class="flex justify-between items-center pt-1 text-xs text-slate-500">
        <span>💡 마우스 휠이나 제스처로 확대해 보실 수 있습니다.</span>
        <button type="button" id="btnConfirmCloseLightbox" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // 1. Supabase 연동 설정
    // ========================================================
    const SUPABASE_URL = "https://qyvrlojwagbjjmcaaffe.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Sk7CTdSeRnBTYeK-9Key_g_msHrna8I";
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // ========================================================
    // 2. 보안 스토리지 기반 Gemini API 키 관리
    // ========================================================
    function getGeminiApiKey() {
      let key = localStorage.getItem('MY_GEMINI_API_KEY');
      if (!key || !key.trim()) {
        key = prompt("Gemini API 키를 입력해 주세요.\n(최초 1회만 입력하면 이 브라우저에 안전하게 저장됩니다):");
        if (key && key.trim()) {
          key = key.trim();
          localStorage.setItem('MY_GEMINI_API_KEY', key);
        }
      }
      return key ? key.trim() : null;
    }

    function resetGeminiApiKey() {
      const current = localStorage.getItem('MY_GEMINI_API_KEY') || '';
      const newKey = prompt("새로운 Gemini API 키를 입력하세요 (취소 시 기존 키 유지):", current);
      if (newKey !== null && newKey.trim()) {
        localStorage.setItem('MY_GEMINI_API_KEY', newKey.trim());
        alert("API 키가 성공적으로 변경 및 저장되었습니다.");
      }
    }

    let allIntakes = [];
    let selectedIndex = -1;
    let currentPhotos = [];
    let selectedPhotoIndex = 0;
    let currentConfirmedMeds = [];
    let currentConfirmedOtc = []; // 확정 영양제·일반약·건기식 관리 배열
    let editingMedIndex = -1; // 현재 부분 수정(오탈자 편집) 중인 약품 인덱스

    // HTML 속성 주입 시 따옴표 깨짐 방지 유틸리티
    function escapeHtmlAttr(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // ========================================================
    // 3. 환자별 작성 데이터(약물 목록 + 입력창) 자동 보존 엔진
    // ========================================================
    function loadPatientDrafts() {
      try {
        const raw = localStorage.getItem('admin_patient_drafts');
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function savePatientDrafts(drafts) {
      try {
        localStorage.setItem('admin_patient_drafts', JSON.stringify(drafts));
      } catch (e) {}
    }

    function saveCurrentPatientDraft() {
      if (selectedIndex < 0 || !allIntakes[selectedIndex]) return;
      const patient = allIntakes[selectedIndex];
      if (!patient || !patient.id) return;

      const drafts = loadPatientDrafts();

      const nameInput = document.getElementById('medNameInput');
      const doseInput = document.getElementById('medDoseInput');
      const freqSelect = document.getElementById('timingFreqSelect');
      const freqCustom = document.getElementById('timingFreqCustom');
      const timeSelect = document.getElementById('timingTimeSelect');
      const timeCustom = document.getElementById('timingTimeCustom');
      const mealSelect = document.getElementById('timingMealSelect');
      const mealCustom = document.getElementById('timingMealCustom');

      drafts[patient.id] = {
        confirmedMeds: currentConfirmedMeds || [],
        confirmedOtc: currentConfirmedOtc || [], // 영양제 임시저장 보존
        selectedPhotoIndex: selectedPhotoIndex || 0,
        tempName: nameInput ? nameInput.value : '',
        tempDose: doseInput ? doseInput.value : '1정',
        tempFreq: freqSelect ? freqSelect.value : '1일 1회',
        tempFreqCustom: freqCustom ? freqCustom.value : '',
        tempTime: timeSelect ? timeSelect.value : '아침',
        tempTimeCustom: timeCustom ? timeCustom.value : '',
        tempMeal: mealSelect ? mealSelect.value : '식후',
        tempMealCustom: mealCustom ? mealCustom.value : '',
        savedAt: Date.now()
      };

      savePatientDrafts(drafts);
    }

    function restoreInputDraft(patientId) {
      const drafts = loadPatientDrafts();
      const draft = drafts[patientId];
      if (!draft) return;

      const nameInput = document.getElementById('medNameInput');
      const doseInput = document.getElementById('medDoseInput');
      if (nameInput && draft.tempName !== undefined) nameInput.value = draft.tempName;
      if (doseInput && draft.tempDose !== undefined) doseInput.value = draft.tempDose;

      const freqSelect = document.getElementById('timingFreqSelect');
      const freqCustom = document.getElementById('timingFreqCustom');
      if (freqSelect && draft.tempFreq) {
        freqSelect.value = draft.tempFreq;
        if (draft.tempFreq === 'custom' && freqCustom) {
          freqCustom.classList.remove('hidden');
          freqCustom.value = draft.tempFreqCustom || '';
        }
      }

      const timeSelect = document.getElementById('timingTimeSelect');
      const timeCustom = document.getElementById('timingTimeCustom');
      if (timeSelect && draft.tempTime) {
        timeSelect.value = draft.tempTime;
        if (draft.tempTime === 'custom' && timeCustom) {
          timeCustom.classList.remove('hidden');
          timeCustom.value = draft.tempTimeCustom || '';
        }
      }

      const mealSelect = document.getElementById('timingMealSelect');
      const mealCustom = document.getElementById('timingMealCustom');
      if (mealSelect && draft.tempMeal) {
        mealSelect.value = draft.tempMeal;
        if (draft.tempMeal === 'custom' && mealCustom) {
          mealCustom.classList.remove('hidden');
          mealCustom.value = draft.tempMealCustom || '';
        }
      }
    }

    function attachDraftAutoSaveListeners() {
      const ids = [
        'medNameInput', 'medDoseInput',
        'timingFreqSelect', 'timingFreqCustom',
        'timingTimeSelect', 'timingTimeCustom',
        'timingMealSelect', 'timingMealCustom'
      ];
      ids.forEach(function(id) {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', saveCurrentPatientDraft);
          el.addEventListener('change', saveCurrentPatientDraft);
        }
      });
    }

    function resetPatientDraft() {
      if (selectedIndex < 0 || !allIntakes[selectedIndex]) return;
      const patient = allIntakes[selectedIndex];
      if (!confirm('[' + (patient.patient_name || '환자') + '] 님의 작성 중인 약품 목록을 초기화하고 처음 문진 상태로 되돌릴까요?')) {
        return;
      }

      const drafts = loadPatientDrafts();
      delete drafts[patient.id];
      savePatientDrafts(drafts);

      editingMedIndex = -1;
      currentConfirmedMeds = [];
      selectedPhotoIndex = 0;
      if (patient.direct_meds && Array.isArray(patient.direct_meds) && patient.direct_meds.length > 0) {
        currentConfirmedMeds = patient.direct_meds
          .filter(function(m) { return m.name && m.name.trim(); })
          .map(function(m) {
            return {
              name: m.name.trim(),
              dose: (m.dose || '1정').trim(),
              timing: (m.note || '처방대로').trim(),
              source: '환자 직접 입력'
            };
          });
      }

      renderQueue();
      renderDetail(patient);
    }

    // ========================================================
    // 4. 대기 목록 데이터 로드 및 실시간 환자 검색
    // ========================================================
    async function fetchIntakeList() {
      if (!supabaseClient) {
        const qEl = document.getElementById('patientQueue');
        if (qEl) qEl.innerHTML = '<div class="p-6 text-center text-xs text-rose-600 font-bold">Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</div>';
        return;
      }

      try {
        const res = await supabaseClient
          .from('intakes')
          .select('*')
          .order('created_at', { ascending: false });

        if (res.error) throw res.error;

        allIntakes = res.data || [];
        renderQueue();

        const pendingCount = allIntakes.filter(function(i) {
          return (i.status || '대기중') !== '완료';
        }).length;

        const counterEl = document.getElementById('queueCounter');
        if (counterEl) {
          counterEl.innerText = '대기: ' + pendingCount + '건 / 총 ' + allIntakes.length + '건';
        }

        if (selectedIndex >= 0 && selectedIndex < allIntakes.length) {
          renderDetail(allIntakes[selectedIndex]);
          restoreInputDraft(allIntakes[selectedIndex].id);
          attachDraftAutoSaveListeners();
        }
      } catch (err) {
        console.error("데이터 조회 실패:", err);
        const qEl = document.getElementById('patientQueue');
        if (qEl) {
          qEl.innerHTML = '<div class="p-6 text-center text-xs text-rose-600">데이터 로드 오류: ' + err.message + '</div>';
        }
      }
    }

    function handlePatientSearch() {
      const searchInput = document.getElementById('patientSearchInput');
      const clearBtn = document.getElementById('btnClearSearch');
      if (clearBtn && searchInput) {
        if (searchInput.value.trim().length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
      }
      renderQueue();
    }

    function clearPatientSearch() {
      const searchInput = document.getElementById('patientSearchInput');
      const clearBtn = document.getElementById('btnClearSearch');
      if (searchInput) searchInput.value = '';
      if (clearBtn) clearBtn.classList.add('hidden');
      renderQueue();
    }

    function renderQueue() {
      const container = document.getElementById('patientQueue');
      if (!container) return;

      if (allIntakes.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-xs text-slate-400">접수된 문진표가 없습니다.</div>';
        return;
      }

      const filterEl = document.getElementById('statusFilter');
      const statusFilterVal = filterEl ? filterEl.value : 'ALL';

      const searchInput = document.getElementById('patientSearchInput');
      const rawKeyword = searchInput ? searchInput.value.trim().toLowerCase() : '';
      const numericKeyword = rawKeyword.replace(/[^0-9]/g, '');

      const filteredList = allIntakes
        .map(function(item, idx) { return { item: item, idx: idx }; })
        .filter(function(entry) {
          const item = entry.item;
          const itemStatus = item.status || '대기중';

          if (!rawKeyword) {
            if (statusFilterVal === '대기중' && itemStatus === '완료') return false;
            if (statusFilterVal === '완료' && itemStatus !== '완료') return false;
            return true;
          }

          const nameStr = String(item.patient_name || item.name || '').toLowerCase();
          const rawBirthStr = String(item.patient_birth || item.birth || '').toLowerCase();
          const digitsBirth = rawBirthStr.replace(/[^0-9]/g, '');
          const birth6Digits = digitsBirth.length === 8 ? digitsBirth.slice(2) : digitsBirth;

          const isNameMatch = nameStr.indexOf(rawKeyword) !== -1;
          const isBirthRawMatch = rawBirthStr.indexOf(rawKeyword) !== -1;
          const isBirthDigitMatch = numericKeyword.length > 0 && (
            digitsBirth.indexOf(numericKeyword) !== -1 || birth6Digits.indexOf(numericKeyword) !== -1
          );

          return isNameMatch || isBirthRawMatch || isBirthDigitMatch;
        });

      if (filteredList.length === 0) {
        if (rawKeyword) {
          container.innerHTML = '<div class="p-8 text-center text-xs text-slate-400 space-y-1"><p class="font-bold text-slate-600">"' + rawKeyword + '" 검색 결과가 없습니다.</p><p>이름이나 생년월일 6자리를 다시 확인해 주세요.</p></div>';
        } else {
          container.innerHTML = '<div class="p-8 text-center text-xs text-slate-400">해당 상태의 환자가 없습니다. 상단 필터를 [전체 보기]로 변경해 보세요.</div>';
        }
        return;
      }

      const drafts = loadPatientDrafts();

      container.innerHTML = filteredList.map(function(entry) {
        const item = entry.item;
        const idx = entry.idx;
        const isSelected = idx === selectedIndex;
        const time = item.created_at ? new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
        
        let rfBadge = '';
        if (item.rf_level === 'emergency_119') rfBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] bg-rose-600 text-white font-bold">🚨 119응급</span>';
        else if (item.rf_level === 'sameday_hospital') rfBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] bg-amber-500 text-white font-bold">⚠️ 당일내원</span>';

        let modifiedBadge = '';
        if (item.is_modified) {
          const modTime = item.updated_at ? new Date(item.updated_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
          modifiedBadge = `<span class="bg-amber-100 text-amber-900 border border-amber-300 text-[10px] px-1.5 py-0.5 rounded-full font-bold animate-pulse">환자 수정됨${modTime ? ' (' + modTime + ')' : ''}</span>`;
        }

        let proxyBadge = '';
        let organRiskBadge = '';
        const memoStr = item.dosage_memo || '';
        if (memoStr.includes('보호자 대리 작성')) {
          proxyBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 font-bold">대리</span>';
        }
        if (memoStr.includes('콩팥') || memoStr.includes('간질환')) {
          organRiskBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 font-bold">신장·간 주의</span>';
        }

        const isExistingText = item.is_existing === 'existing' ? '단골' : '신규';
        const itemStatus = item.status || '대기중';
        const statusClass = itemStatus === '완료' ? 'bg-slate-200 text-slate-600' : 'bg-emerald-100 text-emerald-800 font-bold';
        const photoCount = (item.photos && item.photos.length) ? item.photos.length : 0;
        const activeBg = isSelected ? 'bg-emerald-50 border-l-4 border-emerald-600' : 'hover:bg-slate-50';

        const hasDraft = drafts[item.id] && (

    function selectIntake(idx) {
      if (selectedIndex >= 0 && selectedIndex !== idx) {
        saveCurrentPatientDraft();
      }

      editingMedIndex = -1;
      selectedIndex = idx;
      const item = allIntakes[idx];
      currentPhotos = (item && item.photos) ? item.photos : [];

      const drafts = loadPatientDrafts();
      if (item && item.id && drafts[item.id]) {
        const draft = drafts[item.id];
        currentConfirmedMeds = draft.confirmedMeds ? draft.confirmedMeds.slice() : [];
        currentConfirmedOtc = draft.confirmedOtc ? draft.confirmedOtc.slice() : [];
        selectedPhotoIndex = draft.selectedPhotoIndex || 0;
      } else {
        currentConfirmedMeds = [];
        currentConfirmedOtc = [];
        selectedPhotoIndex = 0;
        if (item && item.direct_meds && Array.isArray(item.direct_meds) && item.direct_meds.length > 0) {
          currentConfirmedMeds = item.direct_meds
            .filter(function(m) { return m.name && m.name.trim(); })
            .map(function(m) {
              return {
                name: m.name.trim(),
                dose: (m.dose || '1정').trim(),
                timing: (m.note || '처방대로').trim(),
                source: '환자 직접 입력'

        // 환자가 문진표에 적은 영양제가 있다면 초기 세팅

          const supples = item.supple_names.split(/[,/\n;]+/).map(s => s.trim()).filter(Boolean);
          currentConfirmedOtc = supples.map(s => ({

      renderQueue();

        renderDetail(item);

        if (mainEl) mainEl.scrollTop = 0;

      saveCurrentPatientDraft();

      document.body.classList.remove('show-detail');

    // ========================================================
    // 5. 고속 이미지 캔버스 압축 및 약봉투 OCR 엔진
    // ========================================================
    function compressImageForAi(dataUrl, maxDim) {
      const limit = maxDim || 1600;
      return new Promise(function(resolve) {
        const img = new Image();
        img.onload = function() {
          let w = img.width;
          let h = img.height;
          if (w > limit || h > limit) {
            if (w > h) {
              h = Math.round((h * limit) / w);
              w = limit;
            } else {
              w = Math.round((w * limit) / h);
              h = limit;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.88));
        };
        img.onerror = function() { resolve(dataUrl); };
        img.src = dataUrl;
      });
    }

    async function runPrescriptionOcr() {
      if (!currentPhotos || currentPhotos.length === 0) {
        alert("첨부된 사진이 없습니다.");
        return;
      }

      const apiKey = getGeminiApiKey();
      if (!apiKey) {
        alert("API 키가 설정되지 않아 분석을 진행할 수 없습니다.");
        return;
      }

      const targetPhoto = currentPhotos[selectedPhotoIndex];
      if (!targetPhoto || !targetPhoto.dataUrl) {
        alert("분석할 사진을 선택해 주세요.");
        return;
      }

      const spinner = document.getElementById('ocrLoadingSpinner');
      const btn = document.getElementById('btnRunOcr');
      spinner.classList.remove('hidden');
      btn.disabled = true;

      try {
        const compressedDataUrl = await compressImageForAi(targetPhoto.dataUrl);
        const base64Data = compressedDataUrl.split(',')[1];

        // 지능형 2-트랙 분류 프롬프트: 처방 조제약 vs 일반약/건기식/영양제/파스 분리 추출
        const prompt = [
          "당신은 대한민국 병원 및 약국의 문서·의약품·건강기능식품 판독 전문 수석약사입니다.",
          "제공된 이미지(처방전, 조제 약봉투, 일반의약품 겉포장 상자, 건강기능식품/영양제 라벨 병, 파스 포장지, 조제 영수증 등)를 정밀 분석하여 의약품 및 영양제 목록을 추출하세요.",
          "",
          "[추출 및 자동 분류 절대 규칙]",
          "이미지에 나타난 품목을 성격에 따라 반드시 아래 2개 그룹으로 명확히 구분하여 출력하세요:",
          "1. prescription_meds (병원/의원 처방 조제약):",
          "   - 처방전, 조제 약봉투, 복약안내문에 인쇄된 전문의약품 및 조제 약제",
          "   - name(약품명), dose(1회량, 예: 1정), timing(용법, 예: 1일 1회 아침식후)",
          "2. otc_supplements (환자 복용 일반약 · 영양제 · 건강기능식품 · 파스):",
          "   - 영양제, 비타민, 오메가3, 유산균, 루테인, 미네랄, 마그네슘, 밀크씨슬, 홍삼, 콜라겐 등 건강기능식품",
          "   - 약국에서 처방 없이 구매한 일반의약품(진통제, 감기약, 소화제 등), 한약제제",
          "   - 외용 관절 파스, 소염진통 외용제, 바르는 연고 등",
          "   - name(품목명), note(복용법 또는 구분 메모, 예: 1일 1회 복용, 주 2~3회 부착 등)",
          "",
          "반드시 마크다운 기호 없이 순수 JSON 객체만 출력하세요:",
          "{",
          '  "prescription_meds": [',
          '    { "name": "약품명", "dose": "1정", "timing": "1일 1회 식후" }',
          '  ],',
          '  "otc_supplements": [',
          '    { "name": "품목명", "note": "복용법 또는 사용구분" }',
          '  ]',
          "}"
        ].join("\n");

        const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=" + apiKey;
        const controller = new AbortController();
        const timeoutId = setTimeout(function() { controller.abort(); }, 35000);

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                {
                  inlineData: {
                    mimeType: "image/jpeg",
                    data: base64Data
                  }
                }
              ]
            }]
          })
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          const errJson = await response.json().catch(function() { return {}; });
          throw new Error((errJson.error && errJson.error.message) || ("HTTP " + response.status));
        }

        const resultData = await response.json();
        const tick = String.fromCharCode(96);
        const fenceRegex = new RegExp(tick + tick + tick + "(?:json)?", "gi");
        const candidateText = resultData.candidates &&
          resultData.candidates[0] &&
          resultData.candidates[0].content &&
          resultData.candidates[0].content.parts &&
          resultData.candidates[0].content.parts[0] &&
          resultData.candidates[0].content.parts[0].text;

        const rawText = candidateText ? candidateText.replace(fenceRegex, "").trim() : "";
        if (!rawText) throw new Error("문서에서 텍스트를 읽어오지 못했습니다.");

        let parsedResult = null;
        try {
          parsedResult = JSON.parse(rawText);
        } catch (e) {
          throw new Error("JSON 파싱 실패: " + e.message);
        }

        let addedRxCount = 0;
        let addedOtcCount = 0;

        // 1) 처방약 배열 분기 등록
        const rxList = Array.isArray(parsedResult) ? parsedResult : (parsedResult.prescription_meds || []);
        rxList.forEach(function(m) {
          if (m.name && m.name.trim()) {
            const trimmedName = m.name.trim();
            // 영양제/일반약 키워드가 섞여 들어온 경우 방어 필터링
            if (/오메가|루테인|비타민|유산균|밀크씨슬|마그네슘|칼슘|아연|홍삼|콜라겐|파스/.test(trimmedName) && !Array.isArray(parsedResult)) {
              if (!currentConfirmedOtc.some(function(o) { return o.name === trimmedName; })) {
                currentConfirmedOtc.push({
                  name: trimmedName,
                  note: (m.timing || '복용 중').trim(),
                  source: '사진 자동인식'
                });
                addedOtcCount++;
              }
              return;
            }

            const exists = currentConfirmedMeds.some(function(cur) { return cur.name === trimmedName; });
            if (!exists) {
              currentConfirmedMeds.push({
                name: trimmedName,
                dose: (m.dose || '1정').trim(),
                timing: (m.timing || '처방대로').trim(),
                source: '약봉투/처방전 OCR'
              });
              addedRxCount++;
            }
          }
        });

        // 2) 일반약 / 영양제 / 건기식 배열 분기 등록 (영양제 탭으로 직행)
        const otcList = parsedResult.otc_supplements || [];
        otcList.forEach(function(o) {
          if (o.name && o.name.trim()) {
            const trimmedOtc = o.name.trim();
            const exists = currentConfirmedOtc.some(function(cur) { return cur.name === trimmedOtc; });
            if (!exists) {
              currentConfirmedOtc.push({
                name: trimmedOtc,
                note: (o.note || '복용 중').trim(),
                source: '영양제/일반약 사진 OCR'
              });
              addedOtcCount++;
            }
          }
        });

        renderMedChips();
        renderOtcChips();
        saveCurrentPatientDraft();
        renderQueue();

        let msg = [];
        if (addedRxCount > 0) msg.push(`처방약 ${addedRxCount}개 [복용 약물목록] 등록`);
        if (addedOtcCount > 0) msg.push(`영양제·일반약 ${addedOtcCount}개 [영양제·건기식 목록] 자동 분류 등록`);
        
        if (msg.length === 0) {
          alert("사진에서 새로운 약품이나 영양제를 찾지 못했습니다. 사진이 선명한지 확인해 주세요.");
        } else {
          alert("판독 완료!\n• " + msg.join("\n• "));
        }

      } catch (err) {
        console.error("OCR 분석 실패:", err);
        alert("OCR 판독 알림: " + err.message);
      } finally {
        spinner.classList.add('hidden');
        btn.disabled = false;
      }
    }

    function addManualOtcChip() {
      const nameInp = document.getElementById('otcNameInput');
      const noteInp = document.getElementById('otcNoteInput');
      const name = nameInp ? nameInp.value.trim() : '';
      const note = (noteInp && noteInp.value.trim()) ? noteInp.value.trim() : '복용 중';

      if (!name) {
        alert("영양제 또는 일반약 이름을 입력해 주세요.");
        if (nameInp) nameInp.focus();
        return;
      }

      currentConfirmedOtc.push({
        name: name,
        note: note,
        source: '약사 직접 추가'
      });

      if (nameInp) nameInp.value = '';
      if (noteInp) noteInp.value = '복용 중';
      renderOtcChips();
      saveCurrentPatientDraft();
    }

    function deleteOtcChip(idx) {
      currentConfirmedOtc.splice(idx, 1);
      renderOtcChips();
      saveCurrentPatientDraft();
    }

    window.renderOtcChips = renderOtcChips;
    window.addManualOtcChip = addManualOtcChip;
    window.deleteOtcChip = deleteOtcChip;

    // 인라인 수정 모드 시작
    function startEditMedChip(idx) {
      editingMedIndex = idx;
      renderMedChips();
      setTimeout(function() {
        const nameEl = document.getElementById('editMedName_' + idx);
        if (nameEl) {
          nameEl.focus();
          const len = nameEl.value.length;
          nameEl.setSelectionRange(len, len);
        }
      }, 20);
    }

    // 인라인 수정 저장
    function saveEditMedChip(idx) {
      const nameEl = document.getElementById('editMedName_' + idx);
      const doseEl = document.getElementById('editMedDose_' + idx);
      const timingEl = document.getElementById('editMedTiming_' + idx);

      const newName = nameEl ? nameEl.value.trim() : '';
      const newDose = (doseEl && doseEl.value.trim()) ? doseEl.value.trim() : '1정';
      const newTiming = (timingEl && timingEl.value.trim()) ? timingEl.value.trim() : '처방대로';

      if (!newName) {
        alert("약품명을 입력해 주세요.");
        if (nameEl) nameEl.focus();
        return;
      }

      const prevSource = currentConfirmedMeds[idx] ? (currentConfirmedMeds[idx].source || '') : '';
      const updatedSource = prevSource.indexOf('(약사 교정)') !== -1 ? prevSource : (prevSource ? prevSource + ' (약사 교정)' : '약사 교정');

      currentConfirmedMeds[idx] = {
        name: newName,
        dose: newDose,
        timing: newTiming,
        source: updatedSource
      };

      editingMedIndex = -1;
      renderMedChips();
      saveCurrentPatientDraft();
      renderQueue();
    }

    // 인라인 수정 취소
    function cancelEditMedChip() {
      editingMedIndex = -1;
      renderMedChips();
    }

    // 인라인 수정 입력창에서 Enter(저장) / Esc(취소) 단축키 지원
    function handleEditMedKeydown(e, idx) {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveEditMedChip(idx);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEditMedChip();
      }
    }

    function handleTimingSelectChange(selectEl, customInputId) {
      const customInput = document.getElementById(customInputId);
      if (!customInput) return;
      if (selectEl.value === 'custom') {
        customInput.classList.remove('hidden');
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
        customInput.value = '';
      }
      saveCurrentPatientDraft();
    }

    function getCombinedTiming() {
      const freqSel = document.getElementById('timingFreqSelect');
      const freqInp = document.getElementById('timingFreqCustom');
      const timeSel = document.getElementById('timingTimeSelect');
      const timeInp = document.getElementById('timingTimeCustom');
      const mealSel = document.getElementById('timingMealSelect');
      const mealInp = document.getElementById('timingMealCustom');

      const freqVal = (freqSel && freqSel.value === 'custom') ? (freqInp.value.trim() || '1일 1회') : (freqSel ? freqSel.value : '1일 1회');
      const timeVal = (timeSel && timeSel.value === 'custom') ? (timeInp.value.trim()) : (timeSel && timeSel.value !== 'none' ? timeSel.value : '');
      const mealVal = (mealSel && mealSel.value === 'custom') ? (mealInp.value.trim()) : (mealSel && mealSel.value !== 'none' ? mealSel.value : '');

      const parts = [freqVal, timeVal, mealVal].filter(Boolean);
      return parts.length > 0 ? parts.join(' ') : '1일 1회 식후';
    }

    function addManualMedChip() {
      const nameInput = document.getElementById('medNameInput');
      const doseInput = document.getElementById('medDoseInput');

      const name = nameInput ? nameInput.value.trim() : '';
      const dose = (doseInput && doseInput.value.trim()) ? doseInput.value.trim() : '1정';
      const timing = getCombinedTiming();

      if (!name) {
        alert("약품명을 입력해 주세요.");
        if (nameInput) nameInput.focus();
        return;
      }

      currentConfirmedMeds.push({
        name: name,
        dose: dose,
        timing: timing,
        source: '약사 직접 입력'
      });

      if (nameInput) nameInput.value = '';
      if (doseInput) doseInput.value = '1정';
      if (nameInput) nameInput.focus();

      editingMedIndex = -1;
      renderMedChips();
      saveCurrentPatientDraft();
      renderQueue();
    }

    function handleMedInputKeypress(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addManualMedChip();
      }
    }

    function deleteMedChip(idx) {
      if (editingMedIndex === idx) {
        editingMedIndex = -1;
      } else if (editingMedIndex > idx) {
        editingMedIndex--;
      }
      currentConfirmedMeds.splice(idx, 1);
      renderMedChips();
      saveCurrentPatientDraft();
      renderQueue();
    }

    function importDirectMeds() {
      if (selectedIndex < 0 || !allIntakes[selectedIndex]) return;
      const item = allIntakes[selectedIndex];
      if (!item.direct_meds || item.direct_meds.length === 0) {
        alert("환자가 직접 입력한 약물 데이터가 없습니다.");
        return;
      }

      let count = 0;
      item.direct_meds.forEach(function(m) {
        if (m.name && m.name.trim()) {
          const trimmed = m.name.trim();
          const exists = currentConfirmedMeds.some(function(cur) { return cur.name === trimmed; });
          if (!exists) {
            currentConfirmedMeds.push({
              name: trimmed,
              dose: (m.dose || '1정').trim(),
              timing: (m.note || '처방대로').trim(),
              source: '환자 직접 입력'
            });
            count++;
          }
        }
      });

      editingMedIndex = -1;
      renderMedChips();
      saveCurrentPatientDraft();
      renderQueue();
      alert(count + "개의 환자 입력 약물을 가져와 자동 저장했습니다.");
    }

      let directMedsHtml = '';

      // 단골 조제 의뢰 정보 및 확장 메타데이터(작성자 구분, 기저질환, 식이습관) 추출
      let visitDate = item.pharmacy_visit_date || '';
      let doctorName = item.prescribing_doctor || '';
      let cleanDosageMemo = item.dosage_memo || '';
      let isProxy = false;
      let proxyRelation = '';
      let chronicConditions = (item.chronic_conditions && Array.isArray(item.chronic_conditions))
        ? item.chronic_conditions.slice()

      let dietaryHabits = (item.dietary_habits && Array.isArray(item.dietary_habits))

      if (cleanDosageMemo) {

        if (proxyMatch) {

        }

        const dietaryMatch = cleanDosageMemo.match(/\[식이·생활습관\]\s*([^\n]+)/);
        if (dietaryMatch) {

            <span class="font-bold text-emerald-900 flex items-center gap-1">📋 단골 전산 조제 의뢰 정보:</span>
            <span class="text-slate-700"><strong>방문(조제)일자:</strong> <span class="font-semibold text-slate-900">${visitDate || '미기재'}</span></span>
            <span class="text-slate-700"><strong>처방의사/병원:</strong> <span class="font-semibold text-slate-900">${doctorName || '미기재'}</span></span>

    function selectOcrPhoto(idx) {

    function openLightboxPhoto(photoIdx, event) {
      if (event) event.stopPropagation();
      const p = currentPhotos[photoIdx];
      if (!p) return;
      document.getElementById('lightboxImg').src = p.dataUrl;
      document.getElementById('lightboxTitle').innerText = p.name || ('사진 ' + (photoIdx + 1) + ' 원본 미리보기');
      document.getElementById('imageLightboxModal').classList.remove('hidden');
    }

    function closeImageLightbox() {
      document.getElementById('imageLightboxModal').classList.add('hidden');
      document.getElementById('lightboxImg').src = '';
    }

    function openReplyEditor() {
      if (selectedIndex < 0 || !allIntakes[selectedIndex]) {
        alert("선택된 환자 데이터가 없습니다.");
        return;
      }

      // 만약 수정 모드가 열려 있었다면 자동 저장 후 이동
      if (editingMedIndex >= 0) {
        saveEditMedChip(editingMedIndex);
      } else {
        saveCurrentPatientDraft();
      }

      if (currentConfirmedMeds.length === 0) {
        const proceed = confirm("등록된 복용 약물이 없습니다. 이대로 회신서 작성을 진행할까요?");
        if (!proceed) return;
      }

      const selectedPatient = allIntakes[selectedIndex];

      // dosage_memo에 태그가 포함되어 있다면 파싱하여 명시적 속성으로 부여
      let visitDate = selectedPatient.pharmacy_visit_date || '';
      let doctorName = selectedPatient.prescribing_doctor || '';
      let isProxy = false;
      let proxyRelation = '';
      let chronicConditions = (selectedPatient.chronic_conditions && Array.isArray(selectedPatient.chronic_conditions))
        ? selectedPatient.chronic_conditions.slice()
        : (selectedPatient.chronicConditions && Array.isArray(selectedPatient.chronicConditions) ? selectedPatient.chronicConditions.slice() : []);
      let dietaryHabits = (selectedPatient.dietary_habits && Array.isArray(selectedPatient.dietary_habits))
        ? selectedPatient.dietary_habits.slice()
        : (selectedPatient.dietaryHabits && Array.isArray(selectedPatient.dietaryHabits) ? selectedPatient.dietaryHabits.slice() : []);

      if (selectedPatient.dosage_memo) {
        const proxyMatch = selectedPatient.dosage_memo.match(/\[작성자 구분\]\s*(보호자 대리 작성(?:\s*\(관계:\s*([^)]*)\))?|본인 직접 작성)/);
        if (proxyMatch && proxyMatch[1].includes('보호자 대리 작성')) {
          isProxy = true;
          proxyRelation = proxyMatch[2] ? proxyMatch[2].trim() : '';
        }
        const chronicMatch = selectedPatient.dosage_memo.match(/\[기저질환\]\s*([^\n]+)/);
        if (chronicMatch) {
          chronicConditions = chronicMatch[1].split(',').map(s => s.trim());
        }
        const dietaryMatch = selectedPatient.dosage_memo.match(/\[식이·생활습관\]\s*([^\n]+)/);
        if (dietaryMatch) {
          dietaryHabits = dietaryMatch[1].split(',').map(s => s.trim());
        }
        if (!visitDate || !doctorName) {
          const match = selectedPatient.dosage_memo.match(/\[단골 조제 의뢰 정보\]\s*방문일자:\s*([^|\n]+)\s*\|\s*처방의사\/병원:\s*([^\n]+)/);
          if (match) {
            if (!visitDate) visitDate = match[1].trim();
            if (!doctorName) doctorName = match[2].trim();
          }
        }
      }

      // currentConfirmedOtc를 문자열과 객체 배열 두 가지 형태로 동시 패키징하여 전달
      const otcCombinedStr = (currentConfirmedOtc && currentConfirmedOtc.length > 0)
        ? currentConfirmedOtc.map(function(o) {
            return o.name + (o.note && o.note !== '복용 중' && o.note !== '문진표 기재' ? ' (' + o.note + ')' : '');
          }).join(', ')
        : (selectedPatient.supple_names || '');

      const payload = Object.assign({}, selectedPatient, {
        pharmacy_visit_date: visitDate,
        prescribing_doctor: doctorName,
        confirmed_meds: currentConfirmedMeds,
        confirmed_otc: currentConfirmedOtc, // OCR/직접등록된 영양제 목록 전달
        supple_names: otcCombinedStr,        // reply.html 호환용 문자열 동기화
        is_proxy: isProxy ? 'yes' : 'no',
        proxy_relation: proxyRelation,
        chronic_conditions: chronicConditions,
        dietary_habits: dietaryHabits
      });

      sessionStorage.setItem('selected_patient_intake', JSON.stringify(payload));
      localStorage.setItem('selected_patient_intake', JSON.stringify(payload));
      window.open('reply.html', '_blank');
    }

    async function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === '완료' ? '대기중' : '완료';

        const res = await supabaseClient.from('intakes').update({ status: newStatus }).eq('id', id);

        fetchIntakeList();
      } catch (err) {

    window.importDirectMeds = importDirectMeds;
    window.handleMedInputKeypress = handleMedInputKeypress;
    window.runPrescriptionOcr = runPrescriptionOcr;
    window.resetGeminiApiKey = resetGeminiApiKey;
    window.handleTimingSelectChange = handleTimingSelectChange;
    window.resetPatientDraft = resetPatientDraft;

    // ========================================================
    // 환자 수정 실시간 감지 및 상세 모달 피드백
    // ========================================================
    function handleUpdatedIntake(record) {
      if (!record || !record.id) return;

      const existingIdx = allIntakes.findIndex(item => item.id === record.id);
      if (existingIdx !== -1) {
        allIntakes[existingIdx] = record;
        renderQueue();
      } else {
        fetchIntakeList();
        return;
      }

      // 만약 약사가 현재 해당 환자의 상세 정보를 열람 중이라면 실시간 알림 배너 표출
      if (selectedIndex >= 0 && allIntakes[selectedIndex] && allIntakes[selectedIndex].id === record.id) {
        showPatientModifiedAlert(record);
      }
    }

    function showPatientModifiedAlert(record) {
      let banner = document.getElementById('patientModifiedAlertBanner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'patientModifiedAlertBanner';
        banner.className = 'bg-amber-100 border-2 border-amber-400 text-amber-950 p-3 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-between mb-3 shadow-md animate-pulse';
        const card = document.getElementById('detailCard');
        if (card) {
          card.insertBefore(banner, card.firstChild);
        }
      }
      banner.innerHTML = `
        <span class="flex items-center gap-2">
          <span class="text-base sm:text-lg">⚠️</span>
          <span>환자가 문진표 내용을 방금 실시간으로 수정했습니다!</span>
        </span>
        <button type="button" onclick="reloadCurrentPatientModal('${record.id}')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-bold text-xs transition cursor-pointer shadow-xs">
          최신 내용 새로고침
        </button>
      `;
    }

    function reloadCurrentPatientModal(recordId) {
      const idx = allIntakes.findIndex(item => item.id === recordId);
      if (idx !== -1) {
        selectIntake(idx);
        const banner = document.getElementById('patientModifiedAlertBanner');
        if (banner) banner.remove();
      }
    }

    window.handleUpdatedIntake = handleUpdatedIntake;
    window.showPatientModifiedAlert = showPatientModifiedAlert;
    window.reloadCurrentPatientModal = reloadCurrentPatientModal;

    // 실시간 웹소켓 구독 (INSERT + UPDATE 모두 감지)
    if (supabaseClient) {
      supabaseClient
        .channel('realtime-intakes')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'intakes' }, function() {
          const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
          audio.play().catch(function() {});
          fetchIntakeList();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'intakes' }, function(payload) {
          handleUpdatedIntake(payload.new);
        })
        .subscribe();
    }

    window.addEventListener('DOMContentLoaded', fetchIntakeList);
    fetchIntakeList();
  </script>
</body>
</html>
